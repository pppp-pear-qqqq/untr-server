{% extends "template.html" %}
{% block head %}
<link rel="stylesheet" href="style/note.css">
<link rel="stylesheet" href="style/index.css">
<link rel="stylesheet" href="style/title.css">
<script type="module" src="script/index.js"></script>
<script type="module" src="script/entry.js"></script>
{% endblock %}
{% block content %}
<h1>
	<svg viewBox="-150 -150 300 300" height="200px" width="200px" style="overflow:visible">
		<linearGradient id="title-gradient-h" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ff88ff"></stop><stop offset="100%" stop-color="#88ff88"></stop></linearGradient>
		<linearGradient id="title-gradient-c" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ff8888"></stop><stop offset="100%" stop-color="#8888ff"></stop></linearGradient>
		<g stroke-linejoin="round" fill="rgb(0,0,0,0)" stroke-linecap="butt" stroke-linejoin="round" stroke-width="6" stroke-opacity="1">
			<g stroke="url(#title-gradient-c)">
				<path d="M0,-228L0,-242M59.01,-220.23L62.63,-233.76M114.00,-197.45L121.00,-209.58M161.22,-161.22L171.12,-171.12M197.45,-114.00L209.58,-121.00M220.23,-59.01L233.76,-62.63M228,0L242,0M220.23,59.01L233.76,62.63M197.45,114.00L209.58,121.00M161.22,161.22L171.12,171.12M114.00,197.45L121.00,209.58M59.01,220.23L62.63,233.76M0,228L0,242M-59.01,220.23L-62.63,233.76M-114.00,197.45L-121.00,209.58M-161.22,161.22L-171.12,171.12M-197.45,114.00L-209.58,121.00M-220.23,59.01L-233.76,62.63M-228,0L-242,0M-220.23,-59.01L-233.76,-62.63M-197.45,-114.00L-209.58,-121.00M-161.22,-161.22L-171.12,-171.12M-114.00,-197.45L-121.00,-209.58M-59.01,-220.23L-62.63,-233.76" />
				<circle cx="0" cy="0" r="236" />
			</g>
			<path id="clock-hand" stroke="url(#title-gradient-h)" d="m0.00001-267.673669c-8.79202 79.83581-23.46392 90.9391-23.46392 105.42579c0 11.57657 6.71195 21.39399 16.01988 24.87409v112.09575a26.883064 26.327924 0 0 0-19.43993 25.27804a26.883064 26.327924 0 0 0 26.88397 26.3288a26.883064 26.327924 0 0 0 26.88395-26.3288a26.883064 26.327924 0 0 0-19.43992-25.28766v-112.08613c9.30794-3.4801 16.01989-13.29752 16.01989-24.87409c0-14.48669-14.67191-25.58998-23.46392-105.42579zm0 257.880319a9.999268 9.792781 0 0 1 9.99985 9.79335a9.999268 9.792781 0 0 1-9.99985 9.79335a9.999268 9.792781 0 0 1-9.99984-9.79335a9.999268 9.792781 0 0 1 9.99984-9.79335z" />
		</g>
	</svg>
	one day's' talk
</h1>
<div id="entry">
	{% if actor %}
	<p>ログイン済み <a href="home"><ic class="ri-home-line"></ic>ホームへ</a></p>
	<p>または <a id="logout" href="entry/logout"><ic class="ri-logout-circle-line"></ic>ログアウト</a></p>
	{% else %}
	<form id="login" method="post" action="entry/login" data-encode="form">
		<input type="hidden" name="code">
		<button type="submit">ログイン</button>
	</form>
	または
	<form id="register" method="post" action="entry/register" data-encode="form" autocomplete="off">
		<input type="hidden" name="code">
		<button type="submit">新規登録</button>
		<ic role="button" class="help ri-question-line">
			<template>
				<a target="_blank" href="https://untroche.com">ポータルサイト</a>と連携してアカウントを登録します（ボタンを押すと画面がポップアップします）。<br>
				このサイトでユーザー名やパスワードを入力することはありませんが、先にポータルサイトでアカウント作成・ログインしておいてください。
			</template>
		</ic>
		<br>
		<small>新規登録を押した時点で<a href="#tos">利用規約</a>に同意したものと見なします</small>
	</form>
	{% endif %}
</div>
{% include "tos.html" %}
{% endblock %}
