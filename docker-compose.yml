x-rust-base: &rust-base
    build:
        context: .
        dockerfile: app/Dockerfile.dev
    volumes:
        - ./Cargo.toml:/app/Cargo.toml:ro
        - ./Cargo.lock:/app/Cargo.lock
        - ./app:/app/app
        - target:/app/target
        - cargo-cache:/usr/local/cargo/registry
    networks: [untroche]

x-sqlite-web-base: &sqlite-web-base
    image: ghcr.io/coleifer/sqlite-web:latest
    restart: always
    # environment:
    #     - SQLITE_WEB_PASSWORD=your_secret_password
    command: /data/database.db -p 8080

services:
    # --- Nginx (リバースプロキシ) ---
    nginx:
        image: nginx:alpine
        ports:
            - "8080:8080"
        environment:
            - ASSET_SUFFIX=
            - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
        volumes:
            - ./nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
            - ./app/common/resource:/app/app/common
            - ./app/portal/resource:/app/app/portal
            # - ./app/erltod/resource:/app/app/erltod
            - ./app/ondyst/resource:/app/app/ondyst
        depends_on:
            - portal
            # - erltod
            - ondyst
        networks: [untroche]

    watcher:
        build:
            context: .
            dockerfile: watcher/Dockerfile.dev
        environment:
            - MINIFY=
        volumes:
            - ./app:/app/app
            - ./tsconfig.json:/app/tsconfig.json:ro
            - ./watcher/compile.sh:/app/compile.sh:ro
            - ./watcher/compile_all.sh:/app/compile_all.sh:ro

    portal:
        <<: *rust-base
        environment:
            - APP_NAME=portal
            - SERVER_PORT=8000
            - DATABASE_URL=sqlite:app/portal/database.db
            - RUST_LOG=debug
        networks: [untroche]

    # erltod:
    #     <<: *rust-base
    #     environment:
    #         - APP_NAME=erltod
    #         - SERVER_PORT=8005
    #         - DATABASE_URL=sqlite:app/erltod/database.db
    #     networks: [untroche]

    ondyst:
        <<: *rust-base
        environment:
            - APP_NAME=ondyst
            - SERVER_PORT=8006
            - DATABASE_URL=sqlite:app/ondyst/database.db
        networks: [untroche]

    sqlite-web-portal:
        <<: *sqlite-web-base
        ports: ["127.0.0.1:3300:8080"]
        volumes: [./app/portal/database.db:/data/database.db]

    sqlite-web-ondyst:
        <<: *sqlite-web-base
        ports: ["127.0.0.1:3306:8080"]
        volumes: [./app/ondyst/database.db:/data/database.db]

networks:
    untroche:

volumes:
    target:
    cargo-cache:
