[workspace]
package = { edition = "2024", authors = ["untroche"] }
members = ["app/common", "app/ondyst", "app/portal", "app/upload"]
resolver = "3"

[workspace.dependencies]
actix-files = "0.7.2"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = "4.17.0"
argon2 = "0.6.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
common.path = "app/common"
dotenv = "0.15.0"
env_logger = "0.11.11"
futures-util = "0.3.34"
fxhash = "0.2.1"
glob = "0.3.4"
log = "0.4.34"
minify-html = "0.18.1"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
rkyv = { version = "0.8.18", features = ["unaligned"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["sqlite", "chrono", "runtime-tokio"] }
strum = { version = "0.28.0", features = ["derive"] }
tera = "2.4.0"
tokio = "1.54.0"
uuid = { version = "1.28.0", features = ["serde", "v4"] }
validator = { version = "0.21.0", features = ["derive"] }
