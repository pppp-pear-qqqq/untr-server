[workspace]
package = { edition = "2024", authors = ["untroche"] }
members = ["app/common", "app/erltod", "app/ondyst", "app/portal"]
resolver = "3"

[workspace.dependencies]
actix-files = "0.6.10"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = "4.14.0"
argon2 = { version = "0.5.3", features = ["std"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
common.path = "app/common"
dotenv = "0.15.0"
env_logger = "0.11.11"
html-codec.path = "lib/html-codec"
minify-html = "0.18.1"
reqwest = { version = "0.13.4", features = ["json"] }
rkyv = { version = "0.8.17", features = ["unaligned"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["sqlite", "chrono", "runtime-tokio"] }
tera = "1.20.1"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
validation.path = "lib/validation"
