<!DOCTYPE html>
<html lang="ja" data-theme="light">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
		<title>{{title}}</title>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.min.css">
		<base href="/">
		<link rel="stylesheet" href="style/theme.css">
		<link rel="stylesheet" href="common/style/base.css">
		<link rel="stylesheet" href="common/style/notice.css">
		<link rel="stylesheet" href="common/style/layout.css">
		<link rel="stylesheet" href="style/component.css">
		<script>document.documentElement.dataset.theme = localStorage.getItem('theme') ?? document.documentElement.dataset.theme</script>
		<script defer src="script/common.js"></script>
		{% block head %}{% endblock %}
	</head>
	<body>
		{% if type != "min" %}
		<header>
			<button type="button" aria-controls="main-menu" aria-expanded="false">
				<span></span>
			</button>
			<nav id="main-menu">
				<a href=""><ic class="ri-global-line"></ic>Top</a>
				{% if user %}
				<a href="home"><ic class="ri-home-line"></ic>Home</a>
				{% endif %}
				<a href="entry"><ic class="ri-login-circle-line"></ic>Entry</a>
				<div class="partition"></div>
				<div class="tool-box">
					<a title="ライトテーマ" data-theme="light"><ic class="ri-sun-line"></ic></a>
					<a title="ダークテーマ" data-theme="dark"><ic class="ri-moon-line"></ic></a>
				</div>
				<small class="credit">2026 <a target="_blank" href="https://x.com/untroche_ar">untroche</a></small>
			</nav>
			{% if user %}
			<div id="user-data">
				ログイン中: <span class="username">{{user.name}}</span>
			</div>
			{% endif %}
		</header>
		<main>{% block content %}{% endblock %}</main>
		<dialog id="help" closedby="any"></dialog>
		{% else %}
		{% block content %}{% endblock %}
		{% endif %}
	</body>
</html>
