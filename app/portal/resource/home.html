{% extends "template.html" %}
{% block head %}
<link rel="stylesheet" href="common/style/note.css">
<link rel="stylesheet" href="common/style/form.css">
{% endblock %}
{% block content %}
<article>
	<h2>設定</h2>
	<form method="post" action="home/setting">
		<label>プロフィール<textarea name="profile">{{profile|default(value='')}}</textarea></label>
		<label>Webhook URL<input type="text" name="webhook" value="{{webhook|default(value='')}}"></label>
		<button type="submit">更新</button>
	</form>
</article>
{% endblock %}
